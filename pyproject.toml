[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-invest"
version = "0.3.0"
description = "Automation toolkit for stock data collection, valuation, and portfolio allocation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["vnstock"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
auto-invest = "auto_invest.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
